{% macro quota_cell(target, name, resource, usage) %}
{% if user_role in ("admin", "operator") %}
<span class="stat-with-edit">
  {% if usage.quota == "∞" %}<span class="stat-muted">∞</span>{% else %}{{ usage.quota }}{% endif %}
  <button
    type="button"
    class="stat-edit-btn"
    data-edit="quota"
    data-target="{{ target }}"
    data-name="{{ name }}"
    data-resource="{{ resource }}"
    data-quota-minutes="{{ usage.quota_minutes }}"
    aria-label="Edit {{ resource }} quota for {{ name }}"
  >Edit</button>
</span>
{% else %}
{% if usage.quota == "∞" %}<span class="stat-muted">∞</span>{% else %}{{ usage.quota }}{% endif %}
{% endif %}
{% endmacro %}
