{% macro consumption_cell(target, name, resource, usage) %}
{% if user_role in ("admin", "operator") %}
<span class="stat-with-edit">
  {{ usage.consumed }}
  <button
    type="button"
    class="stat-edit-btn"
    data-edit="consumption"
    data-target="{{ target }}"
    data-name="{{ name }}"
    data-resource="{{ resource }}"
    data-consumed="{{ usage.consumed }}"
    aria-label="Adjust {{ resource }} consumption for {{ name }}"
  >Edit</button>
</span>
{% else %}
{{ usage.consumed }}
{% endif %}
{% endmacro %}
