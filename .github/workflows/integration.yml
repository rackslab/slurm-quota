name: integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Install git
        run: dnf -y install git
      - uses: actions/checkout@v5
      - name: Install Python 3.9 and pip
        run: dnf -y install python3.9 python3.9-pip
      - name: Create non-root test user
        run: |
          useradd -m -u 1001 ciuser
          chown -R ciuser:ciuser "$GITHUB_WORKSPACE"
      - name: Install dev dependencies as non-root
        run: |
          su -s /bin/bash ciuser -c "cd \"$GITHUB_WORKSPACE\" && python3.9 -m pip install --user -U pip"
          su -s /bin/bash ciuser -c "cd \"$GITHUB_WORKSPACE\" && python3.9 -m pip install --user \".[dev]\""
      - name: Run all tests as non-root
        run: su -s /bin/bash ciuser -c "cd \"$GITHUB_WORKSPACE\" && python3.9 -m pytest"
