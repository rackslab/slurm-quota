name: unittest

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          # Python 3.9 is not available for Ubuntu >= 26.04 in setup-python,
          # keep testing it on older runner as it is still the system Python
          # of RHEL 9 and derivatives.
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LDAP build dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Install dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest
