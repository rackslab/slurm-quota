name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (example: 1.2.3 or v1.2.3)"
        required: false
        type: string
      distribution:
        description: "Distribution target for mock build"
        required: false
        default: "el9"
        type: choice
        options:
          - el9

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
      # mock needs mounts/namespaces (tmpfs on /proc, chroot/bootstrap). Default GHA
      # containers are too locked down; Podman-in-Docker also needs this.
      options: --privileged
    env:
      EL_TARGET: ${{ github.event.inputs.distribution || 'el9' }}
      # Keep mock output concise by default. Set MOCK_VERBOSE=1 for -v, or MOCK_TRACE=1.
      MOCK_VERBOSE: "0"
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git mock mock-core-configs

      - uses: actions/checkout@v6

      # Container job: checkout is owned by a different UID than the job user; git 2.35+ refuses
      # commands like `git archive` unless the directory is marked safe.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build SRPM and RPMs
        run: |
          VERSION_INPUT=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_INPUT="${GITHUB_REF_NAME}"
          fi
          if [ -n "${{ github.event.inputs.version || '' }}" ]; then
            VERSION_INPUT="${{ github.event.inputs.version || '' }}"
          fi
          if [ -z "${VERSION_INPUT}" ]; then
            echo "Unable to determine package version." >&2
            echo "Provide workflow_dispatch input 'version' or run from a tag ref." >&2
            exit 1
          fi
          packaging/scripts/mock-build.sh "${VERSION_INPUT}" "${EL_TARGET}"

      - name: Show mock logs on failure
        if: failure()
        run: |
          for f in build/mock/*.log; do
            if [ -f "$f" ]; then
              echo "======== $f ========"
              tail -n 400 "$f" || true
            fi
          done

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v5
        with:
          name: slurm-quota-rpm-${{ github.ref_name }}
          path: |
            build/mock/*.rpm
            build/mock/*.src.rpm
            build/mock/*.log
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/mock/*.rpm
            build/mock/*.src.rpm
          fail_on_unmatched_files: true
