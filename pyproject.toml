[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-quota"
version = "2.0.0"
description = "Slurm quota management tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
web = [
  "flask>=2",
  "jinja2>=2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "flask>=2",
  "jinja2>=2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--cov=slurm_quota",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
