[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-quota"
version = "2.0.0"
description = "Slurm quota management tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }

[project.scripts]
slurm-quota = "slurm_quota.cli:main"
slurm-quota-charge = "slurm_quota.charge:main"
slurm-quota-serve = "slurm_quota.serve:main"
slurm-quota-migrate = "slurm_quota.migrate:main"
slurm-quota-web = "slurm_quota.web:main"

[project.optional-dependencies]
web = [
  "flask>=2",
  "jinja2>=2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "flask>=2",
  "jinja2>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"slurm-quota/web/wsgi" = ["web/wsgi/slurm-quota-web.wsgi"]
"slurm-quota/web/templates" = ["web/templates/*"]
"slurm-quota/web/static" = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--cov=slurm_quota",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["src/slurm_quota"]
omit = [
  "tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
